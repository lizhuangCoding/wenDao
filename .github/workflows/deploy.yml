name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  DEPLOY_COMPOSE_FILES: ${{ vars.DEPLOY_COMPOSE_FILES || '-f docker-compose.prod.yml -f docker-compose.ip.yml' }}

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull latest code and rebuild stack
        shell: bash
        run: |
          set -euo pipefail

          deploy_path_q="$(printf '%q' "$DEPLOY_PATH")"
          compose_files_q="$(printf '%q' "$DEPLOY_COMPOSE_FILES")"

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=${deploy_path_q} DEPLOY_COMPOSE_FILES=${compose_files_q} bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          git checkout -B main origin/main
          git reset --hard origin/main

          echo "=== deployment host memory ==="
          free -h || true
          echo "=== deployment host disk ==="
          df -h || true
          echo "=== docker disk usage ==="
          docker system df || true
          echo "=== prune docker build cache before deploy ==="
          docker builder prune -af || true
          docker container prune -f || true
          docker image prune -f || true
          echo "=== docker disk usage after prune ==="
          docker system df || true

          export BUILDKIT_PROGRESS=plain
          export COMPOSE_PROGRESS=plain
          dump_compose_debug() {
            status="$?"
            if [[ "$status" -ne 0 ]]; then
              echo "=== docker compose status after failure ==="
              docker compose --env-file .env.production ${DEPLOY_COMPOSE_FILES} ps || true
              echo "=== mysql logs ==="
              docker compose --env-file .env.production ${DEPLOY_COMPOSE_FILES} logs --tail=200 mysql || true
              echo "=== redis logs ==="
              docker compose --env-file .env.production ${DEPLOY_COMPOSE_FILES} logs --tail=100 redis || true
              echo "=== backend logs ==="
              docker compose --env-file .env.production ${DEPLOY_COMPOSE_FILES} logs --tail=100 backend || true
            fi
            exit "$status"
          }
          trap dump_compose_debug EXIT

          docker compose --env-file .env.production ${DEPLOY_COMPOSE_FILES} up -d --build
          docker compose --env-file .env.production ${DEPLOY_COMPOSE_FILES} ps
          docker image prune -f
          REMOTE
